config_version = 15

[bar.default]
end = [ "bar", "cpu", "temp", "ram", "tray", "notifications", "volume", "control-center", "battery", "network" ]
font_scale = 0.89999998733401299
margin_edge = 5
margin_ends = 5
margin_opposite_edge = 5
radius = 5
thickness = 25

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

