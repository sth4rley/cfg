# Gerado pelo Noctalia a partir de ~/.config/noctalia/templates/foot-live.conf
# Consumido por ~/.config/noctalia/scripts/foot-apply-live.sh, que converte estas
# cores em sequencias OSC e as escreve nos ptys das janelas do foot abertas.
#
# Existe porque o foot NAO tem reload de config em runtime: SIGUSR1/SIGUSR2 apenas
# alternam entre as secoes [colors-dark] / [colors-light] que ja estao em memoria.
# Em modo servidor isso e pior, porque todo footclient herda a config que o processo
# `foot --server` parseou no startup -- dai o tema so mudar ao reiniciar o servidor.
#
# Indices 0-7 = cores normais, 8-15 = brilhantes (mesma ordem do foot.ini).
0={{colors.terminal_normal_black.default.hex}}
1={{colors.terminal_normal_red.default.hex}}
2={{colors.terminal_normal_green.default.hex}}
3={{colors.terminal_normal_yellow.default.hex}}
4={{colors.terminal_normal_blue.default.hex}}
5={{colors.terminal_normal_magenta.default.hex}}
6={{colors.terminal_normal_cyan.default.hex}}
7={{colors.terminal_normal_white.default.hex}}
8={{colors.terminal_bright_black.default.hex}}
9={{colors.terminal_bright_red.default.hex}}
10={{colors.terminal_bright_green.default.hex}}
11={{colors.terminal_bright_yellow.default.hex}}
12={{colors.terminal_bright_blue.default.hex}}
13={{colors.terminal_bright_magenta.default.hex}}
14={{colors.terminal_bright_cyan.default.hex}}
15={{colors.terminal_bright_white.default.hex}}
fg={{colors.terminal_foreground.default.hex}}
bg={{colors.terminal_background.default.hex}}
cursor={{colors.terminal_cursor.default.hex}}
selbg={{colors.terminal_selection_bg.default.hex}}
selfg={{colors.terminal_selection_fg.default.hex}}
